global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'crawler'
    static_configs:
      - targets: ['crawler:8000']
    scrape_interval: 10s
    metrics_path: '/metrics'

  - job_name: 'processor'
    static_configs:
      - targets: ['processor:8000']
    scrape_interval: 10s
    metrics_path: '/metrics'

  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 10s
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: '/minio/prometheus/metrics'
