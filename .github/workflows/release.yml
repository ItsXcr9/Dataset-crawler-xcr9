name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, xcr9]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Extract metadata
      id: meta
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG=${GITHUB_REF#refs/tags/}
        else
          TAG=${{ inputs.tag }}
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Extract version without 'v' prefix if present
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push crawler image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.crawler
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/crawler:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/crawler:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.title=Crawler
          org.opencontainers.image.description=Web crawler component for LLM dataset creation
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Build and push processor image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.processor
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/processor:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/processor:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.title=Processor
          org.opencontainers.image.description=Data processor component for LLM dataset creation
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.api
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.title=API
          org.opencontainers.image.description=REST API component for LLM dataset creation
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Build and push WebUI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.webui
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webui:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webui:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.title=WebUI
          org.opencontainers.image.description=Web interface component for LLM dataset creation
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      continue-on-error: true  # Attestation may fail if not configured
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
        push-to-registry: true

    - name: Update Docker Compose with latest images
      run: |
        sed -i "s|image:.*crawler.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/crawler:${{ steps.meta.outputs.version }}|g" docker-compose.yml
        sed -i "s|image:.*processor.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/processor:${{ steps.meta.outputs.version }}|g" docker-compose.yml
        sed -i "s|image:.*api.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.meta.outputs.version }}|g" docker-compose.yml
        sed -i "s|image:.*webui.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webui:${{ steps.meta.outputs.version }}|g" docker-compose.yml

    - name: Create release artifact
      run: |
        zip -r release-artifacts-${{ steps.meta.outputs.version }}.zip \
          docker-compose.yml \
          .github/workflows/ \
          README.md \
          TRAINING_GUIDE.md \
          LEARNINGDOC.md

    - name: Upload release artifacts
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-artifacts-${{ steps.meta.outputs.version }}.zip
        asset_name: release-artifacts-${{ steps.meta.outputs.version }}.zip
        asset_content_type: application/zip
