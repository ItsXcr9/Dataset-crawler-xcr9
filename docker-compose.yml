version: '3.8'

services:
  # PostgreSQL database for metadata and job tracking
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crawldb
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - crawler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queuing and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crawler_network
    command: redis-server --appendonly yes

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - crawler_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Crawler service
  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://crawler:crawler123@postgres:5432/crawldb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=INFO
    volumes:
      - ./dataset:/app/dataset
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - crawler_network
    deploy:
      replicas: 3
    restart: unless-stopped

  # Data processor service
  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://crawler:crawler123@postgres:5432/crawldb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=INFO
    volumes:
      - ./dataset:/app/dataset
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - crawler_network
    deploy:
      replicas: 2
    restart: unless-stopped

  # API service for job management and monitoring
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://crawler:crawler123@postgres:5432/crawldb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - crawler_network
    restart: unless-stopped

  # Web UI for dataset management
  webui:
    build:
      context: .
      dockerfile: docker/Dockerfile.webui
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - crawler_network
    restart: unless-stopped

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - crawler_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - crawler_network
    depends_on:
      - prometheus

  # Flower for Celery monitoring (if using Celery for distributed tasks)
  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=user:password
    networks:
      - crawler_network
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  crawler_network:
    driver: bridge
